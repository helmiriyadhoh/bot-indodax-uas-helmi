name: Indodax Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel tick endpoint
        run: |
          set +e
          RESPONSE=$(curl -sS -X POST "$TICK_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w '
HTTP_STATUS:%{http_code}')
          STATUS=$(echo "$RESPONSE" | tail -n 1 | sed 's/HTTP_STATUS://')
          echo "$RESPONSE"
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
